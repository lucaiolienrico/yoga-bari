name: Aggiorna lastmod sitemap

# Il sito è statico puro, senza build step (Cloudflare Pages pubblica il
# repo così com'è). Per avere <lastmod> sempre corretto senza toccare la
# pipeline di deploy Cloudflare, questa action aggiorna sitemap.xml ad
# ogni push reale su main e lo ricommitta. paths-ignore evita che il
# commit dell'action stessa (che tocca solo sitemap.xml) triggeri di
# nuovo questo stesso workflow.
on:
  push:
    branches: [main]
    paths-ignore:
      - "sitemap.xml"

permissions:
  contents: write

jobs:
  update-lastmod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Aggiorna <lastmod>
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          sed -i "s#<lastmod>.*</lastmod>#<lastmod>${TODAY}</lastmod>#" sitemap.xml

      - name: Commit se cambiato
        run: |
          if ! git diff --quiet sitemap.xml; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add sitemap.xml
            git commit -m "chore: aggiorna lastmod sitemap.xml"
            git push
          else
            echo "lastmod già aggiornato, nessun commit necessario"
          fi
