[build]
  publish = "."

# Redirect SPA — necessario per far funzionare /admin
[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

# Catch-all per SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Header sicurezza
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
