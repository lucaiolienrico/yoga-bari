[build]
  # Nessun comando di build necessario per sito HTML puro
  publish = "."

# Abilita Netlify Identity per login admin
[[plugins]]
  package = "@netlify/plugin-sitemap"

# Header sicurezza
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"

# Redirect per SPA admin
[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200
